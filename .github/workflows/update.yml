name: Refresh data & deploy

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch news + metrics
        env:
          PAGES_URL: https://trevay8.github.io/The-Ledger
        run: node scripts/fetch-data.mjs

      - name: Dump data (temporary debug)
        run: tar czf - data | base64 -w0 | sed 's/^/DATADUMP:/'; echo

      - name: Keep a copy of the data (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: data/
          retention-days: 3

      - id: pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
